# cargo-deny configuration for ForSt-RS
# Enforced by .github/workflows/ci-security.yml
#
# Authoritative spec: .planning/refactor-review/A1_reconciliation.md §1.4 / §8 @ 33f85b1c5
# Plan: .planning/refactor-review/G1_gha_rebuild_plan.md §1.5 / Task 5 @ 33f85b1c5

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (e.g. `forst-rs-common = { path = "..." }`)
# don't carry a version number and would otherwise trip the wildcard
# check. `allow-wildcard-paths` exempts intra-workspace path deps.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",         # xxhash-rust (Boost Software License — Apache-2.0-friendly)
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/nexmark/nexmark"]
