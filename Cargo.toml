[workspace]
members = [
    "crates/forst-rs-bench",
    "crates/forst-rs-common",
    "crates/forst-rs-engine",
    "crates/forst-rs-ffi",
    "crates/forst-rs-io",
    "crates/forst-rs-storage",
    "crates/forst-rs-test-harness",
    "crates/forst-rs-test-utils",
]
resolver = "2"

[workspace.package]
edition = "2021"
# MSRV bumped from 1.85 → 1.88 because OpenDAL 0.50 transitively pulls
# icu_*/idna_adapter (1.86+) plus home@0.5.12 (1.88). Verified by ci-rust
# MSRV job failures on 2026-05-10. The OpenDAL backend is required for
# cloud-storage support so we accept the bump.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/nicetoseeyou/ForSt"

[workspace.dependencies]
# Internal crates
forst-rs-bench = { path = "crates/forst-rs-bench" }
forst-rs-common = { path = "crates/forst-rs-common" }
forst-rs-engine = { path = "crates/forst-rs-engine" }
forst-rs-ffi = { path = "crates/forst-rs-ffi" }
forst-rs-io = { path = "crates/forst-rs-io" }
forst-rs-storage = { path = "crates/forst-rs-storage" }
forst-rs-test-harness = { path = "crates/forst-rs-test-harness" }
forst-rs-test-utils = { path = "crates/forst-rs-test-utils" }

# Core dependencies
thiserror = "2"
bytes = "1"
arrow = { version = "54", features = ["ffi"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "fs", "sync", "macros"] }
tracing = "0.1"
arc-swap = "1"

# Object-storage / unified I/O (S3, GCS, Azure, local FS, memory)
# `layers-blocking` is required so OpendalFileSystem can serve sync FileSystem
# trait calls from any thread (with or without an ambient tokio runtime).
# `executors-tokio` provides the tokio-backed Executor required by the
# write-back `.write_with(...).concurrent(N)` multipart uploads — without it
# opendal's default `()` executor PANICS ("concurrent tasks executed with no
# executor has been enabled") on the first concurrent part, failing the SST
# upload and surfacing as EngineIo on every later read of that SST.
opendal = { version = "0.50", default-features = false, features = ["services-fs", "services-memory", "services-s3", "layers-blocking", "executors-tokio"] }

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Checksums — CRC32C (Castagnoli), NOT IEEE CRC32
crc32c = "0.6"

# Hashing — xxHash64 for Bloom Filter
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Dev / testing dependencies
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
