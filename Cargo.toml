[workspace]
members = [
    "crates/forst-rs-common",
    "crates/forst-rs-io",
    "crates/forst-rs-test-utils",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/nicetoseeyou/ForSt"

[workspace.dependencies]
# Internal crates
forst-rs-common = { path = "crates/forst-rs-common" }
forst-rs-io = { path = "crates/forst-rs-io" }
forst-rs-test-utils = { path = "crates/forst-rs-test-utils" }

# Core dependencies
thiserror = "2"
bytes = "1"
arrow = { version = "54", features = ["ffi"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "fs", "sync", "macros"] }
tracing = "0.1"

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Checksums — CRC32C (Castagnoli), NOT IEEE CRC32
crc32c = "0.6"

# Dev / testing dependencies
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
