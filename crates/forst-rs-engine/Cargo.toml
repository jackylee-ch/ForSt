[package]
name = "forst-rs-engine"
version = "0.1.0"
publish = false  # internal-only; never published to crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ForSt-RS engine layer: LSM-tree read/write paths"

[dependencies]
forst-rs-common = { workspace = true }
forst-rs-io = { workspace = true }
forst-rs-storage = { workspace = true }
arc-swap = { workspace = true }
arrow = { workspace = true }
opendal = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# FRS-WAL (2026-06-06): per-record checksums for torn-write detection during
# crash recovery. Already in the lockfile (transitive); promoted to a direct dep.
crc32c = "0.6"

# FRS_MEM_DIAG (2026-06-08): read jemalloc stats.{allocated,resident,retained}
# to attribute the join-OOM engine native memory (live vs retained). Linux-only
# to match the jemalloc global allocator gate in forst-rs-ffi.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

[dev-dependencies]
forst-rs-test-utils = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# S3 integration test (gated by feature `s3-it`; requires Docker). MinIO
# is launched via `testcontainers` GenericImage so we can validate
# `DbImpl::open_remote` against a real S3-compatible backend per spec §6c.
# We only pull `testcontainers` (not `testcontainers-modules`) because we
# override the entrypoint to pre-create the bucket as a `/data/<bucket>`
# directory before `minio server` starts — the module's default image
# doesn't bake in `mc` or `curl`, so the GenericImage path is simpler.
testcontainers = { version = "0.27", features = ["blocking"] }

[features]
default = []
# Integration test that requires Docker (MinIO container). Skipped by
# default so `cargo test --workspace` stays self-contained; CI gates it
# behind a dedicated `s3-integration` job on `ubuntu-latest`.
s3-it = []
