[package]
name = "forst-rs-bench"
version = "0.1.0"
publish = false  # internal-only; never published to crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ForSt-RS performance benchmarks (BM-1.1 through BM-1.5)"

[lib]
# Benchmarks only — no library or binary targets.
name = "forst_rs_bench"
path = "src/lib.rs"

[dependencies]
forst-rs-common = { workspace = true }
forst-rs-engine = { workspace = true }
forst-rs-io = { workspace = true }
forst-rs-storage = { workspace = true }
# Optional RocksDB comparison baseline. Pulled in only when the
# `rocksdb-baseline` feature is on (gates a long ~15 min build of the
# bundled C++ rocksdb sources). Lives under `[dependencies]` rather
# than `[dev-dependencies]` because Cargo forbids optional dev-deps.
rocksdb = { version = "0.22", optional = true }

[dev-dependencies]
arrow = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
# S3 vs local-FS comparison bench (gated by feature `s3-it`; needs Docker).
# Same MinIO image / version pin as the engine S3 integration test.
testcontainers = { version = "0.27", features = ["blocking"] }

[features]
default = []
# Enable side-by-side RocksDB v8.x comparison benches. Long build time
# (~15 min on first cargo build for the bundled C++ rocksdb sources).
rocksdb-baseline = ["dep:rocksdb"]
# S3 vs local-FS perf comparison bench (B-Prod-followup-S3-perf, VP Q6).
# Requires a Docker daemon at run time. Skipped by default so
# `cargo bench --workspace` stays self-contained; CI gates it behind a
# dedicated `s3-perf-bench` workflow on `ubuntu-latest`.
s3-it = []

[[bench]]
name = "point_lookup"
harness = false

[[bench]]
name = "batch_ops"
harness = false

[[bench]]
name = "batch_put_arrow_vs_write_batch"
harness = false

[[bench]]
name = "batch_get_arrow_vs_batch_get"
harness = false

[[bench]]
name = "write_throughput"
harness = false

[[bench]]
name = "checkpoint"
harness = false

[[bench]]
name = "rocksdb_compare"
harness = false
required-features = ["rocksdb-baseline"]

[[bench]]
name = "s3_vs_local"
harness = false
required-features = ["s3-it"]

[[bench]]
name = "component_microbench"
harness = false
