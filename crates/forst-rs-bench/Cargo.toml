[package]
name = "forst-rs-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ForSt-RS performance benchmarks (BM-1.1 through BM-1.5)"

[lib]
# Benchmarks only — no library or binary targets.
name = "forst_rs_bench"
path = "src/lib.rs"

[dependencies]
forst-rs-common = { workspace = true }
forst-rs-engine = { workspace = true }
forst-rs-io = { workspace = true }
forst-rs-storage = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "point_lookup"
harness = false

[[bench]]
name = "batch_ops"
harness = false

[[bench]]
name = "write_throughput"
harness = false

[[bench]]
name = "checkpoint"
harness = false
