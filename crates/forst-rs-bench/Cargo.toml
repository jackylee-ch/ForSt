[package]
name = "forst-rs-bench"
version = "0.1.0"
publish = false  # internal-only; never published to crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ForSt-RS performance benchmarks (BM-1.1 through BM-1.5)"

[lib]
# Benchmarks only — no library or binary targets.
name = "forst_rs_bench"
path = "src/lib.rs"

[dependencies]
forst-rs-common = { workspace = true }
forst-rs-engine = { workspace = true }
# B1 ffi_vectorized boundary-tax bench: links the REAL `frs_*` extern "C"
# entry points (the crate also builds as rlib).
forst-rs-ffi = { workspace = true }
forst-rs-io = { workspace = true }
forst-rs-storage = { workspace = true }
# upload_byte_budget bench: drives the in-flight upload admission policy
# (tokio Semaphore + modeled per-MiB transfer time) to show the byte budget
# bounds resident upload memory. Needs the `time` feature for `sleep`.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# remote_compaction_offload bench: per-thread CPU time (CLOCK_THREAD_CPUTIME_ID)
# to show the calling (TM) thread does ~0 compaction work under the offload
# executor. Build-only standard dep; no run-time service.
libc = "0.2"
# Optional RocksDB comparison baseline. Pulled in only when the
# `rocksdb-baseline` feature is on (gates a long ~15 min build of the
# bundled C++ rocksdb sources). Lives under `[dependencies]` rather
# than `[dev-dependencies]` because Cargo forbids optional dev-deps.
rocksdb = { version = "0.22", optional = true }

[dev-dependencies]
arrow = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
# S3 vs local-FS comparison bench (gated by feature `s3-it`; needs Docker).
# Same MinIO image / version pin as the engine S3 integration test.
testcontainers = { version = "0.27", features = ["blocking"] }

[features]
default = []
# Enable side-by-side RocksDB v8.x comparison benches. Long build time
# (~15 min on first cargo build for the bundled C++ rocksdb sources).
rocksdb-baseline = ["dep:rocksdb"]
# S3 vs local-FS perf comparison bench (B-Prod-followup-S3-perf, VP Q6).
# Requires a Docker daemon at run time. Skipped by default so
# `cargo bench --workspace` stays self-contained; CI gates it behind a
# dedicated `s3-perf-bench` workflow on `ubuntu-latest`.
s3-it = []

[[bench]]
name = "point_lookup"
harness = false

[[bench]]
name = "batch_ops"
harness = false

[[bench]]
name = "batch_put_arrow_vs_write_batch"
harness = false

[[bench]]
name = "batch_get_arrow_vs_batch_get"
harness = false

[[bench]]
name = "write_throughput"
harness = false

[[bench]]
name = "checkpoint"
harness = false

[[bench]]
name = "rocksdb_compare"
harness = false
required-features = ["rocksdb-baseline"]

[[bench]]
name = "s3_vs_local"
harness = false
required-features = ["s3-it"]

[[bench]]
name = "component_microbench"
harness = false

[[bench]]
name = "join_probe_open"
harness = false

# MR-1 (2026-06-15 q7 probe-open prune): COLD reader-open cost of bloom-negative
# SSTs on the interval-join probe path + the realized win of the
# metadata-resident prefix-bloom prune (cold_all vs cold_hit vs mr1_on vs warm).
[[bench]]
name = "probe_open_bloom_prune"
harness = false

# APPROACH-1 (2026-06-15 omnipotent rethink §4.1): persistent seekable probe
# iterator — read-amp (q7 win) + memory-additive (q9 fix) mini-bench.
[[bench]]
name = "persistent_probe_iter"
harness = false

# Approach 2 / V-C pre-build gate: windowed-agg accumulator RMW —
# per-record get→fold→put (today) vs in-engine merge. Confirms the
# round-trip reduction + the read-cost guard (operand-chain bound on flush).
[[bench]]
name = "accumulator_rmw"
harness = false

# B1 (2026-06-12 local FFI/flush/compaction bench design): boundary-tax
# bench over the real frs_* FFI entry points vs engine-direct equivalents.
[[bench]]
name = "ffi_vectorized"
harness = false

# B3 (same design, §B3): compaction-throughput stress bin — the 21 ns/byte
# reproduction target and the L4 windowed-compaction-read before/after
# harness. NOT criterion (wall-clock phase loop); takes --smoke for CI.
[[bin]]
name = "compaction_throughput"
path = "src/bin/compaction_throughput.rs"

# FRS-PHASE2 HEADLINE: forst-rs-disagg (measured link/instant) vs ForSt
# (modeled upload/download at the recorded BOS bandwidth) on the three
# disaggregation-critical operations — checkpoint/restore/bytes-to-remote.
# Wall-clock loop (not criterion); takes --smoke for CI.
[[bin]]
name = "disagg_vs_forst"
path = "src/bin/disagg_vs_forst.rs"

# FRS-PHASE2 disagg write-path backpressure: reproduce the q4-hot MapState
# flush→remote-write→stall collapse under a mock-S3 throttle, then show the
# relief levers hold the throughput floor + complete the in-flight checkpoint.
# Wall-clock loop; takes --smoke.
[[bin]]
name = "disagg_write_backpressure"
path = "src/bin/disagg_write_backpressure.rs"

# FRS-PHASE2 pillar 6b: TM-side CPU during a compaction with the Local vs
# Remote-emulated CompactionMergeExecutor — the offload should show the
# calling (TM) thread doing ~0 compaction CPU. Wall-clock loop; takes --smoke.
[[bin]]
name = "remote_compaction_offload"
path = "src/bin/remote_compaction_offload.rs"

# FRS-PHASE2 cycle-1 evidence: k-way scan cold-start serial-vs-concurrent
# first-block prime under a modeled remote-GET RTT. Quantifies the L1×L4
# cache-miss-tail latency the merge head-seed loop pays serially. --smoke for CI.
[[bin]]
name = "scan_cold_start"
path = "src/bin/scan_cold_start.rs"

# FRS-VLOG-DEREF-FANOUT (Phase-2 cycle 4): coalesced vlog-deref SEGMENT fan-out
# cost model — serial per-segment loop vs concurrent through the read-I/O pool
# (FRS_VLOG_DEREF_FANOUT). Models per-segment ranged-read RTT; quantifies the
# cross-segment deref latency the fan-out removes. Wall-clock bin; takes --smoke
# for CI (caps RTT, asserts the win holds at M>=4).
[[bin]]
name = "vlog_deref_fanout"
path = "src/bin/vlog_deref_fanout.rs"

# FRS-PHASE2 NEXMARK-shaped disagg validation: drives q5/q7/q9-q20/q4 query-
# shaped state workloads through the full disaggregated path on fs-emulation,
# disagg-ON vs disagg-OFF, with a correctness gate + S3 bandwidth projection.
# Wall-clock loop (not criterion); takes --smoke for CI.
[[bin]]
name = "nexmark_disagg_s3"
path = "src/bin/nexmark_disagg_s3.rs"

# FRS-PHASE2 COMBINED-STACK e2e validation: runs the FULL disagg relief stack ON
# together (KV-sep + coalesce-deref + deref-fanout + reader-cache + rate-split +
# async-flush + byte-budget + WAL-DELTA link-ckpt) through open_remote(file://)
# under the FRS_REMOTE_BW_MBPS throttle, three arms (OFF / KV-sep substrate /
# full-ON) each in its own process for OnceLock-faithful flags. Gates correctness
# (byte-identical) + lever-interaction regression. Wall-clock; takes --smoke.
[[bin]]
name = "disagg_combined_stack"
path = "src/bin/disagg_combined_stack.rs"

# FRS-WA-V2a-2-LRU (q9 KV-sep OOM fix, 2026-06-14): resident vlog-reader
# footprint, uncapped (pre-fix) vs bounded (cap=2048), over a wide live-segment
# set. Shows the bound takes footprint from O(segments) to O(cap). Wall-clock
# bin (not criterion); takes --smoke for CI (asserts the bound holds).
[[bin]]
name = "vlog_reader_cache_footprint"
path = "src/bin/vlog_reader_cache_footprint.rs"

# KVSEP-OPTIMAL investigation (2026-06-14): per-deref read-side latency probe —
# cold-seq (scan locality) vs random (point-get) vs hot-hit (cache-hit floor),
# uncompressed vs lz4. Quantifies the deref cost the read-side fix must remove.
[[bin]]
name = "vlog_deref_latency"
path = "src/bin/vlog_deref_latency.rs"

# FRS-PHASE2 catalog #4: checkpoint multi-file upload — serial copy loop vs
# parallel multi-file PUT (FRS_CKPT_PARALLEL_UPLOAD). Models per-object PUT-RTT
# on a remote checkpoint dir; quantifies the checkpoint-barrier upload term.
# Wall-clock bin; takes --smoke for CI (caps RTT, asserts byte-identity).
[[bin]]
name = "checkpoint_upload"
path = "src/bin/checkpoint_upload.rs"

# FRS-PHASE2 catalog #2.3 verify-before-build: cache-admission decay policy —
# FIFO stand-in vs ForSt epoch-decayed cold-list counts. Synthetic Zipf
# access-trace hit-rate simulation (working set >> cache); sweeps skew x
# cache-ratio and prints a MATERIAL/MARGINAL/NEGLIGIBLE verdict. Pure CPU, no
# I/O, no NexMark. Takes --smoke for CI.
[[bin]]
name = "cache_admission_epoch"
path = "src/bin/cache_admission_epoch.rs"

# FRS-VLOG-SCAN-READAHEAD (Phase-2 cycle 6): scan-side prefetch-pipelining
# latency-hiding cost model — serial windows (cycle-5) vs one-window-deep
# readahead (window k+1's coalesced read overlaps window k's consume). Models the
# cross-window RTT term (FRS_MODEL_RTT_MS / FRS_MODEL_CONSUME_MS) over a bounded
# pool mirroring read_io_pool. std-only; --smoke asserts the win at consume≈rtt.
[[bin]]
name = "vlog_scan_readahead"
path = "src/bin/vlog_scan_readahead.rs"

# FRS-PHASE2 UPLOAD-BYTE-BUDGET: byte-aware in-flight upload admission resident
# bound. Drives the exact admission math (count cap = 1 permit/upload vs byte
# budget = ceil(bytes/MiB) over a MiB pool) through a tokio Semaphore over a
# realistic MIXED SST-size stream; tracks PEAK resident upload bytes per arm and
# prints an EFFECTIVE/MARGINAL/INCONCLUSIVE verdict. In-process, no network, no
# NEXMark. Takes --smoke for CI.
[[bin]]
name = "upload_byte_budget"
path = "src/bin/upload_byte_budget.rs"
