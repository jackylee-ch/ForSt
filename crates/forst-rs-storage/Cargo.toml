[package]
name = "forst-rs-storage"
version = "0.1.0"
publish = false  # internal-only; never published to crates.io
description = "SST file format: data blocks, index, bloom filter, header/footer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forst-rs-common = { workspace = true }
forst-rs-io = { workspace = true }
# io_uring BlockIo backend for the §2.1 prefetcher's multi-block window reads.
# Compiles to a stub off Linux (uring_available() == false), so no cfg is
# needed here; the unsafe submission-queue code stays isolated in that crate
# while this one keeps #![forbid(unsafe_code)].
forst-rs-io-uring = { workspace = true }
arrow = { workspace = true }
bytes = { workspace = true }
lz4_flex = { workspace = true }
zstd = { workspace = true }
xxhash-rust = { workspace = true }
arc-swap = { workspace = true }
crossbeam-skiplist = { workspace = true }
# 2026-05-29 PERF: FxHashMap (fast non-crypto hasher) for the vectorized
# memtable's hot hash_index/unsorted_lookup/prefix_index. Profiling q4/q7
# showed Rust's default SipHash (BuildHasher::hash_one + Hasher::write)
# dominated join CPU (~588/sample). FxHash is ~5-10× faster for short keys.
rustc-hash = "2.1"
# FRS-MEMTABLE-INLINE-KEY (2026-06-04): inline small keys in the sorted-index
# `InternalKey` to eliminate the per-entry `Arc<[u8]>` heap allocation (vmmap
# pinned ~137M such allocs ≈ 32 GiB = the q4 memory wall). 48 bytes inline covers
# the NexMark join keys (~36 B); larger keys spill to heap.
smallvec = "1"

# FRS-CACHE-SPACE-LIMIT (catalog #5b): a SAFE statvfs wrapper for the
# free-disk-headroom probe behind the space-based cache limit. This crate is
# #![forbid(unsafe_code)], so the raw libc::statvfs unsafe block is off-limits;
# `nix` exposes a safe `sys::statvfs::statvfs` (the exact same reason
# forst-rs-io already depends on `nix` for posix_fadvise). Unix-only — the
# probe degrades to "unknown" (no extra eviction) on non-unix targets.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["fs"] }

[dev-dependencies]
forst-rs-test-utils = { workspace = true }
tempfile = { workspace = true }
