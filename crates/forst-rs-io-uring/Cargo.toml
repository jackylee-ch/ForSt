[package]
name = "forst-rs-io-uring"
version = "0.1.0"
publish = false  # internal-only; never published to crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux io_uring BlockIo backend for ForSt-RS (isolated: the submission queue requires unsafe, while the storage/io crates forbid(unsafe_code))"

[dependencies]
forst-rs-common = { workspace = true }
forst-rs-io = { workspace = true }

# The io_uring submission/completion queue interface. Linux-only; the crate
# compiles to a stub (uring_available() == false, UringBlockIo::new == None)
# on every other platform so dependents need no cfg.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
tempfile = { workspace = true }
