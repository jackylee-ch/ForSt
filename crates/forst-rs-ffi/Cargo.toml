[package]
name = "forst-rs-ffi"
version = "0.1.0"
publish = false  # internal-only; never published to crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ForSt-RS C ABI bridge for Java FFM / JNI consumers"

[lib]
name = "forst_rs_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
forst-rs-common = { workspace = true }
forst-rs-engine = { workspace = true }
forst-rs-io = { workspace = true }
forst-rs-storage = { workspace = true }
arrow = { workspace = true }

# FRS-JEMALLOC (2026-06-05): global allocator for the cdylib. The default system
# allocator retained ~14 GB of freed small-alloc memory (55.9 M live allocations
# churned per q4) → 43 GB RSS, which does NOT fit the 8c/32g target and swaps.
# jemalloc returns freed pages to the OS (dirty/muzzy decay + background purge)
# and handles small-alloc churn with low fragmentation — the allocator RocksDB
# uses (6.4 GB RSS). Not available under MSVC.
# `disable_initial_exec_tls`: this cdylib is `dlopen`'d at RUNTIME by Flink's FFM
# linker (not loaded at JVM start), so jemalloc's default initial-exec TLS model
# has no static-TLS slot left → "cannot allocate memory in static TLS block" on
# Linux. The general-dynamic TLS model (this feature) is dlopen-safe.
#
# LINUX ONLY (2026-06-06): jemalloc is gated to Linux because the 8c/32g
# memory-fit target IS the Linux container — that is where return-to-OS matters.
# On macOS, jemalloc's pthread-TSD thread-exit destructor SIGSEGVs (si_addr=0x0)
# when a JVM worker thread exits (`_pthread_tsd_cleanup` → jemalloc tsd_cleanup)
# under this dlopen'd dylib — reproduced 3× on q4 (crash at ~896s elapsed). The
# macOS host therefore uses the system allocator (what every prior working q4 run
# used), which also keeps the host A/B vs RocksDB fair.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["disable_initial_exec_tls"] }

# Fault injection harness (L5, umbrella spec §5). Optional behind
# `fault-injection` feature so production cdylib builds pay zero cost.
forst-rs-test-harness = { workspace = true, optional = true }

# Optional JNI shim for G-A drop-in replacement of community ForSt's
# `libforstjni.so`. Pulled in only when the `compat-jni` feature is enabled
# so non-Java consumers (and the bulk of CI) don't pay the dependency cost.
# See `src/compat_jni.rs` and design doc 2.5.
jni = { version = "0.21", optional = true }
# Used by the compat-jni shim only — debug-level diagnostic logging for
# ignored Options setters that forst-rs cannot represent (RocksDB
# Statistics / Env / WriteBufferManager etc). Optional so non-JNI builds
# don't pay the dependency cost.
tracing = { workspace = true, optional = true }

[dev-dependencies]
# Used by P2 compat-jni tests to materialise on-disk checkpoint dirs that
# the engine writes into; never linked into the production cdylib.
tempfile = { workspace = true }
# Fault-injection tests need the harness even without the feature flag.
forst-rs-test-harness = { workspace = true }

[features]
default = []
# Builds the `compat_jni` module exposing `Java_org_forstdb_*` symbols so
# the resulting cdylib can be renamed to `libforstjni.so` and dropped in
# place of `com.ververica:forstjni:0.1.8` for an existing Flink
# `flink-statebackend-forst` deployment (G-A acceptance, design doc 2.5).
compat-jni = ["dep:jni", "dep:tracing"]
# Enable fault injection hooks in FFI entry points. Never enabled in release
# builds. Activate for L5 soak / fuzz testing:
#   cargo test -p forst-rs-ffi --features fault-injection
fault-injection = ["dep:forst-rs-test-harness"]
