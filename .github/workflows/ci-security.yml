#
# Dedicated security audit. Replaces the `audit` job that previously
# lived in the now-deleted ci.yml.

name: ci-security

on:
  push:
    branches: [forst-rs, main]
  pull_request:
    branches: [forst-rs, main]
  schedule:
    - cron: '0 8 * * 1'  # weekly Monday 08:00 UTC
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin-v1
      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install --locked cargo-audit
          fi
      - name: Run cargo audit
        run: cargo audit --file Cargo.lock

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-bin-v1
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install --locked cargo-deny
          fi
      - run: cargo deny check

  dependabot-config:
    name: dependabot.yml lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dependabot.yml is well-formed
        run: |
          test -f .github/dependabot.yml || (echo "missing .github/dependabot.yml"; exit 1)
          # Basic YAML validity check via Python's yaml.safe_load
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/dependabot.yml'))" || \
            (echo "dependabot.yml is not valid YAML"; exit 1)
          echo "✓ dependabot.yml is valid"
