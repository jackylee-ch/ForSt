# ============================================================================
# Full-stack NEXMark accuracy gate — REAL NEXMark SQL through the REAL Flink
# forst-rs backend vs the rocksdb backend, on a fixed deterministic CSV.
# forst-rs vs rocksdb, exact compare, FAIL on ANY output mismatch.
# ============================================================================
#
# This is the GENUINELY FAITHFUL end-to-end accuracy gate: it runs the actual
# NEXMark q3/q5/q8/q11/q12 query SQL through a real Flink standalone cluster on
# BOTH the forst-rs disaggregated backend AND the rocksdb backend, replaying a
# byte-identical fixed CSV, and byte-compares the print-sink changelog rows
# (materialized multiset, sha256). Any DIFF or any missing/failed query FAILS
# the job. It wraps the proven `scripts/accuracy-gate/` harness (spec:
# docs/superpowers/specs/2026-06-12-fixed-csv-accuracy-gate.md, which verified
# 5/5 EQUAL at 1M and is determinism-stable run-to-run).
#
# ---------------------------------------------------------------------------
# WHY SELF-HOSTED (and not hosted ubuntu-latest):
#   The full Flink stack is NOT reproducible on a hosted runner within its
#   limits. It requires:
#     * Flink 2.2.1 — an UNRELEASED version; the only artifact is the dist
#       built from the jackylee-ch/flink fork, a ~12 GB Apache Flink source
#       tree. A full Flink maven build is 30-60+ min and OOMs the ~16 GB
#       hosted runner.
#     * the forst-rs Flink statebackend jar, built from that same fork.
#     * Hadoop, a JDK17 (rocksdb) + JDK25 (forst-rs) standalone cluster, the
#       sql-gateway, and the nexmark-flink jar.
#   So this gate runs on a SELF-HOSTED runner (label: nexmark) that already
#   has the box's prebuilt FLINK_HOME / WORKENV / nexmark-flink. The EVERY-PUSH
#   guard is the hosted engine-level gate in accuracy-gate.yml (the real
#   ForSt-RS engine vs real RocksDB on a NEXMark-shaped workload); this job is
#   the faithful E2E confirmation, run on demand / when a box runner is online.
#
#   If no self-hosted runner with the `nexmark` label is registered, this
#   workflow simply queues and never starts — it never blocks the repo.
# ---------------------------------------------------------------------------
#
# Set these as repo/org Variables (Settings -> Variables -> Actions) to match
# the box, or accept the defaults if the runner uses them:
#   NEXMARK_WORKENV, NEXMARK_FLINK_HOME, NEXMARK_HADOOP_HOME,
#   NEXMARK_JDK17, NEXMARK_JDK25
# The runner must already have nexmark-flink built at
#   nexmark/nexmark-flink/target/nexmark-flink-bin/nexmark-flink/queries/

name: nexmark-accuracy-fullstack

on:
  # HOSTED job (nexmark-accuracy-hosted) runs on every push / PR to forst-rs so
  # GHA actually GUARANTEES real-NEXMark SQL accuracy in the cloud. The
  # self-hosted full-stack job below is the on-demand confirmation at 1M scale.
  push:
    branches: [forst-rs, main]
    paths:
      - 'crates/**'
      - 'scripts/accuracy-gate/**'
      - 'scripts/templates-hosted/**'
      - '.github/workflows/nexmark-accuracy.yml'
  pull_request:
    branches: [forst-rs, main]
    paths:
      - 'crates/**'
      - 'scripts/accuracy-gate/**'
      - 'scripts/templates-hosted/**'
      - '.github/workflows/nexmark-accuracy.yml'
  workflow_dispatch:
    inputs:
      events:
        description: "Fixed-CSV event count (100000 = CI scale ~50 windows, 1000000 = full)"
        required: false
        default: "100000"
      queries:
        description: "NEXMark queries to verify (space-separated)"
        required: false
        default: "q3 q5 q8 q11 q12"
      force_gen:
        description: "Regenerate the fixed CSV even if present"
        type: boolean
        required: false
        default: false

permissions: read-all

jobs:
  fullstack-nexmark-accuracy:
    name: "full-stack NEXMark accuracy (real Flink, forst-rs vs rocksdb)"
    # Self-hosted Tier-2 (1M-scale confirmation) is on-demand ONLY: it would
    # otherwise queue forever on every push when no `nexmark` runner is online.
    # The every-push cloud guarantee is the nexmark-accuracy-hosted job below.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, nexmark]
    timeout-minutes: 180
    env:
      WORKENV: ${{ vars.NEXMARK_WORKENV || '/home/runner/workenv' }}
      FLINK_HOME: ${{ vars.NEXMARK_FLINK_HOME || '/home/runner/workenv/flink-2.2.1' }}
      HADOOP_HOME: ${{ vars.NEXMARK_HADOOP_HOME || '/home/runner/workenv/hadoop-3.4.3' }}
      JDK17: ${{ vars.NEXMARK_JDK17 || '/usr/lib/jvm/java-17-openjdk-amd64' }}
      JDK25: ${{ vars.NEXMARK_JDK25 || '/opt/java/openjdk' }}
      EVENTS_NUM: ${{ github.event.inputs.events || '100000' }}
      QUERIES: ${{ github.event.inputs.queries || 'q3 q5 q8 q11 q12' }}
      REPO: ${{ github.workspace }}
      TEMPLATES: ${{ github.workspace }}/scripts/templates-linux
      NEXMARK_HOME: ${{ github.workspace }}/nexmark/nexmark-flink/target/nexmark-flink-bin/nexmark-flink
      CSV_DIR: /tmp/nexmark-fixed-csv-acc
    steps:
      - name: Checkout (with nexmark submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build forst-rs .so (Linux release) and deploy into Flink lib
        run: |
          cargo build --release -p forst-rs-ffi
          test -f target/release/libforst_rs_ffi.so
          cp target/release/libforst_rs_ffi.so "$FLINK_HOME/lib/libforst_rs_ffi.so"

      - name: Sanity — Flink dist + nexmark queries present on the runner
        run: |
          test -x "$FLINK_HOME/bin/start-cluster.sh" \
            || { echo "::error::FLINK_HOME=$FLINK_HOME is not a Flink dist — register a self-hosted 'nexmark' runner with the box's workenv (see workflow header)"; exit 1; }
          test -d "$NEXMARK_HOME/queries" \
            || { echo "::error::nexmark-flink not built at $NEXMARK_HOME — build it on the runner first"; exit 1; }
          ls "$NEXMARK_HOME/queries"/q*.sql | head

      - name: Generate fixed CSV (deterministic) — once
        run: |
          if [ "${{ github.event.inputs.force_gen }}" = "true" ] || [ ! -d "$CSV_DIR/bid" ]; then
            bash scripts/accuracy-gate/gen-fixed-csv.sh 2>&1 | tee /tmp/gen.log
            grep -q "GEN OK" /tmp/gen.log || { echo "::error::CSV generation failed"; exit 1; }
          else
            echo "reusing existing fixed CSV at $CSV_DIR"
          fi

      - name: Run each query on BOTH backends + compare (FAIL on ANY mismatch)
        env:
          MAXSEC: "900"
        run: |
          set -u
          mkdir -p /tmp/acc-rows
          fail=0
          for q in $QUERIES; do
            for cfg in forst-rs-ffm-local rocksdb; do
              echo "== RUN $q [$cfg] =="
              OUT_FILE="/tmp/acc-rows/$q-$cfg.rows" QUERY="$q" CONFIG="$cfg" \
                bash scripts/accuracy-gate/measure-print.sh \
                2>&1 | tee "/tmp/acc-rows/$q-$cfg.log" || true
              if ! grep -q "VERDICT_TSV	$q	$cfg	" "/tmp/acc-rows/$q-$cfg.log"; then
                echo "::error::$q/$cfg produced no VERDICT_TSV"; fail=1
              fi
            done
          done
          echo "== A/B comparison (forst-rs vs rocksdb) =="
          EB=$(( EVENTS_NUM * 46 / 50 ))   # q12 invariant: bid count = BP/50 of events
          for q in $QUERIES; do
            frs="/tmp/acc-rows/$q-forst-rs-ffm-local.rows"
            rdb="/tmp/acc-rows/$q-rocksdb.rows"
            if [ ! -s "$frs" ] || [ ! -s "$rdb" ]; then
              echo "::error::$q missing capture (frs=$([ -s "$frs" ] && echo ok || echo MISSING) rdb=$([ -s "$rdb" ] && echo ok || echo MISSING))"
              fail=1; continue
            fi
            if ! python3 scripts/accuracy-gate/compare-print.py "$q" "$frs" "$rdb" "$EB"; then
              echo "::error::$q ACCURACY MISMATCH (forst-rs vs rocksdb)"; fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "NEXMark full-stack accuracy gate FAILED"; exit 1; }
          echo "NEXMark full-stack accuracy gate: ALL PASS ($QUERIES)"

      - name: Upload captures + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexmark-accuracy-fullstack
          path: /tmp/acc-rows
          retention-days: 7

  # ==========================================================================
  # HOSTED real-NEXMark accuracy gate — runs on EVERY push / PR (ubuntu-latest).
  #
  # This is the genuinely faithful E2E accuracy guarantee in the CLOUD: it runs
  # the ACTUAL NEXMark q3/q5/q8/q11/q12 SQL through a REAL Flink 2.2.1 standalone
  # cluster on BOTH the forst-rs backend (JDK25, FFM) AND the rocksdb backend
  # (JDK17), replaying a byte-identical 100K-event fixed CSV, then sha256
  # multiset-compares the print-sink changelog rows. Any DIFF / missing query /
  # absent verdict FAILS the job.
  #
  # Why this works on a hosted runner where the prior agent said it couldn't:
  #   The 12 GB was only the Flink SOURCE build. We do NOT build Flink here. We
  #   DOWNLOAD a prebuilt lean Flink 2.2.1 dist (released as
  #   `nexmark-runtime-flink-2.2.1`) which already bundles:
  #     * flink-dist (with librocksdbjni-linux64.so + libforstjni-linux64.so
  #       self-extracted at runtime — so the rocksdb reference needs NO extra
  #       native lib on Linux),
  #     * the forst-rs / rocksdb statebackend jars and the nexmark-flink jar,
  #     * the nexmark q*.sql + ddl files.
  #   The ONLY thing rebuilt per-commit is the forst-rs FFM .so (a cheap ~5 min
  #   Linux Rust build, cached), which the forst-rs jar loads via FFM
  #   (-Dforstrs.native.libpath). A single small TaskManager (accuracy, not the
  #   8c/32g perf split) fits the runner; 100K events is tiny.
  # ==========================================================================
  nexmark-accuracy-hosted:
    name: "hosted real-NEXMark accuracy (real Flink SQL, forst-rs vs rocksdb, 100K)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # CI portability: .cargo/config.toml uses target-cpu=native; hosted runners
      # are CPU-heterogeneous, so pin a universal baseline (SIGILL guard).
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
      RUNTIME_TAG: nexmark-runtime-flink-2.2.1
      RUNTIME: ${{ github.workspace }}/.nexmark-runtime
      EVENTS_NUM: ${{ github.event.inputs.events || '100000' }}
      QUERIES: ${{ github.event.inputs.queries || 'q3 q5 q8 q11 q12' }}
      TEMPLATES: ${{ github.workspace }}/scripts/templates-hosted
      CSV_DIR: /tmp/nexmark-fixed-csv-acc
      MAXSEC: "600"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (rocksdb backend + datagen)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pin JDK17 path
        run: echo "JDK17=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 25 (forst-rs backend)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Pin JDK25 path
        run: echo "JDK25=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-nexacc-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nexacc-

      - name: Cache forst-rs .so build (target dir for forst-rs-ffi)
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-nexacc-${{ hashFiles('Cargo.lock', 'crates/forst-rs-ffi/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-target-nexacc-

      - name: Build forst-rs FFM .so (Linux release)
        run: cargo build --release -p forst-rs-ffi

      - name: Verify .so built
        run: test -f target/release/libforst_rs_ffi.so

      - name: Download prebuilt Flink runtime (dist + backends + nexmark queries)
        run: gh release download "$RUNTIME_TAG" --repo "${{ github.repository }}" --pattern 'nexmark-runtime-flink-2.2.1.tar.gz' --dir /tmp
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract runtime
        run: mkdir -p "$RUNTIME"
      - name: Untar runtime
        run: tar -C "$RUNTIME" -xzf /tmp/nexmark-runtime-flink-2.2.1.tar.gz

      - name: Pin FLINK_HOME / NEXMARK_HOME
        run: echo "FLINK_HOME=$RUNTIME/flink-2.2.1" >> "$GITHUB_ENV"
      - name: Pin NEXMARK_HOME
        run: echo "NEXMARK_HOME=$RUNTIME/nexmark-flink" >> "$GITHUB_ENV"

      # The forst-rs state backend pulls in org.apache.hadoop.conf.Configuration
      # at SQL-submit time (the harness puts $HADOOP_HOME/share/hadoop/**/*.jar on
      # HADOOP_CLASSPATH). rocksdb does not need it. Provide a Hadoop dist so the
      # forst-rs backend can submit. (Cached; ~700 MB download only on cache miss.)
      - name: Cache Hadoop dist
        id: cache-hadoop
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hadoop/hadoop-3.3.6
          key: hadoop-3.3.6-dist
      - name: Download Hadoop 3.3.6 (cache miss only)
        if: steps.cache-hadoop.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.hadoop"
          # dlcdn is the fast CDN mirror; archive.apache.org is the slow fallback.
          curl -fL --retry 3 -o /tmp/hadoop.tgz \
            https://dlcdn.apache.org/hadoop/common/hadoop-3.3.6/hadoop-3.3.6.tar.gz \
            || curl -fL --retry 3 -o /tmp/hadoop.tgz \
            https://archive.apache.org/dist/hadoop/common/hadoop-3.3.6/hadoop-3.3.6.tar.gz
          tar -C "$GITHUB_WORKSPACE/.hadoop" -xzf /tmp/hadoop.tgz
      - name: Pin HADOOP_HOME
        run: echo "HADOOP_HOME=$GITHUB_WORKSPACE/.hadoop/hadoop-3.3.6" >> "$GITHUB_ENV"

      # The packaged dist intentionally omits the (stale) log/ dir to stay small.
      # flink-daemon.sh writes its .out to $FLINK_HOME/log and aborts the daemon
      # if the dir is missing ("No such file or directory") — which silently
      # prevented the JM/TM/gateway from ever starting. Recreate it.
      - name: Create Flink log dir (required by flink-daemon.sh)
        run: mkdir -p "$RUNTIME/flink-2.2.1/log"

      - name: Deploy forst-rs .so into FFM libpath + Flink lib
        run: sudo mkdir -p /usr/local/lib
      - name: Copy .so to /usr/local/lib (FFM libpath)
        run: sudo cp target/release/libforst_rs_ffi.so /usr/local/lib/libforst_rs_ffi.so
      - name: Copy .so to Flink lib
        run: cp target/release/libforst_rs_ffi.so "$RUNTIME/flink-2.2.1/lib/libforst_rs_ffi.so"

      - name: Sanity — Flink dist + nexmark queries present
        run: test -x "$FLINK_HOME/bin/start-cluster.sh"
      - name: Sanity — nexmark queries present
        run: ls "$NEXMARK_HOME/queries"/q*.sql | head

      - name: Sanity — rocksdb + forst JNI Linux native libs bundled in flink-dist
        run: unzip -l "$FLINK_HOME/lib/flink-dist-2.2.1.jar" | grep -E 'librocksdbjni-linux64\.so'

      # The dist's bin/sql-client.sh locates the SQL-client/gateway jars in opt/
      # via a fragile `find -regex`; on the runner that resolved empty and the
      # SqlClient class wasn't on the classpath (ClassNotFoundException). Copy the
      # two client jars into lib/ so constructFlinkClassPath (which globs lib/*.jar)
      # puts them on the classpath unconditionally — robust, find-independent.
      - name: Put SQL client + gateway jars on the Flink lib classpath
        run: cp "$FLINK_HOME"/opt/flink-sql-client-*.jar "$FLINK_HOME"/opt/flink-sql-gateway-*.jar "$FLINK_HOME/lib/"

      - name: Debug — opt/lib layout + SqlClient class presence
        run: |
          echo "== opt =="; ls -la "$FLINK_HOME/opt" | grep -iE 'sql-client|sql-gateway' || true
          echo "== lib sql jars =="; ls -la "$FLINK_HOME/lib" | grep -iE 'sql-client|sql-gateway' || true
          echo "== find regex (as in sql-client.sh.orig) =="; find "$FLINK_HOME/opt" -regex ".*flink-sql-client.*.jar" || true
          echo "== SqlClient class in jar? =="; unzip -l "$FLINK_HOME"/lib/flink-sql-client-*.jar | grep -E 'table/client/SqlClient\.class' || echo "MISSING SqlClient.class"

      - name: Generate fixed CSV (deterministic, JDK17 datagen)
        run: JDK17="$JDK17" bash scripts/accuracy-gate/gen-fixed-csv.sh 2>&1 | tee /tmp/gen.log

      - name: Dump Flink logs if gen did not reach GEN OK (diagnostics)
        if: always()
        run: |
          if ! grep -q "GEN OK" /tmp/gen.log; then
            echo "===== sql-gateway daemon log ====="
            tail -n 200 "$FLINK_HOME"/log/*sql-gateway*.log 2>/dev/null || echo "(no sql-gateway log)"
            echo "===== jobmanager (standalonesession) log ====="
            tail -n 120 "$FLINK_HOME"/log/*standalonesession*.log 2>/dev/null || echo "(no JM log)"
            echo "===== taskexecutor log ====="
            tail -n 80 "$FLINK_HOME"/log/*taskexecutor*.log 2>/dev/null || echo "(no TM log)"
            echo "===== log dir listing ====="
            ls -la "$FLINK_HOME"/log 2>/dev/null || true
          fi

      - name: Verify CSV generated
        run: grep -q "GEN OK" /tmp/gen.log

      # The forst-rs (JDK25+FFM) JM+TM come up and register fine (verified), but
      # the per-query measure-print loop hit a port race: gen-CSV's JDK17 cluster
      # and back-to-back restarts could still hold 6123/8081/8083 when the next
      # cluster starts (measure-print's pkill+sleep 3 is too short on a loaded
      # hosted runner) -> "cluster up (tms=)" + connection-refused. Hard-stop any
      # stale Flink process and free the ports before the loop.
      - name: Stop any stale Flink cluster + free ports
        run: |
          "$FLINK_HOME"/bin/sql-gateway.sh stop >/dev/null 2>&1 || true
          "$FLINK_HOME"/bin/stop-cluster.sh >/dev/null 2>&1 || true
          pkill -9 -f 'TaskManagerRunner|StandaloneSession|SqlGateway|SqlClient' 2>/dev/null || true
          sleep 8
          echo "remaining flink procs:"; pgrep -af 'TaskManagerRunner|StandaloneSession|SqlGateway' || echo none

      - name: Run each query on BOTH backends through real Flink SQL
        run: |
          set -u
          mkdir -p /tmp/acc-rows
          for q in $QUERIES; do
            for cfg in forst-rs-ffm-local rocksdb; do
              echo "== RUN $q [$cfg] =="
              OUT_FILE="/tmp/acc-rows/$q-$cfg.rows" QUERY="$q" CONFIG="$cfg" \
              JDK17="$JDK17" JDK25="$JDK25" TEMPLATES="$TEMPLATES" \
              FLINK_HOME="$FLINK_HOME" NEXMARK_HOME="$NEXMARK_HOME" CSV_DIR="$CSV_DIR" MAXSEC="$MAXSEC" \
                bash scripts/accuracy-gate/measure-print.sh \
                2>&1 | tee "/tmp/acc-rows/$q-$cfg.log" || true
            done
          done

      - name: Compare forst-rs vs rocksdb (sha256, FAIL on ANY mismatch)
        run: |
          set -u
          fail=0
          for q in $QUERIES; do
            for cfg in forst-rs-ffm-local rocksdb; do
              if ! grep -q "VERDICT_TSV	$q	$cfg	" "/tmp/acc-rows/$q-$cfg.log"; then
                echo "::error::$q/$cfg produced no VERDICT_TSV"; fail=1
              fi
            done
          done
          EB=$(( EVENTS_NUM * 46 / 50 ))   # q12 invariant: bid count = BP/50 of events
          for q in $QUERIES; do
            frs="/tmp/acc-rows/$q-forst-rs-ffm-local.rows"
            rdb="/tmp/acc-rows/$q-rocksdb.rows"
            if [ ! -s "$frs" ] || [ ! -s "$rdb" ]; then
              echo "::error::$q missing capture (frs=$([ -s "$frs" ] && echo ok || echo MISSING) rdb=$([ -s "$rdb" ] && echo ok || echo MISSING))"
              fail=1; continue
            fi
            if ! python3 scripts/accuracy-gate/compare-print.py "$q" "$frs" "$rdb" "$EB"; then
              echo "::error::$q ACCURACY MISMATCH (forst-rs vs rocksdb)"; fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "HOSTED NEXMark real-SQL accuracy gate FAILED"; exit 1; }
          echo "HOSTED NEXMark real-SQL accuracy gate: ALL PASS ($QUERIES)"

      - name: Upload captures + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexmark-accuracy-hosted
          path: /tmp/acc-rows
          retention-days: 7
