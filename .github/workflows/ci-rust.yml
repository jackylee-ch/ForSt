# Authoritative spec: .planning/refactor-review/A1_reconciliation.md §5/§6 @ 33f85b1c5
# Plan: .planning/refactor-review/G1_gha_rebuild_plan.md §1.1 @ 89104d8bd
# Coverage gate: hard floor 80% (G1 §3.1 resolved 2026-04-30); stretch target 90%

name: ci-rust

on:
  push:
    branches: [forst-rs, main]
  pull_request:
    branches: [forst-rs, main]

env:
  CARGO_TERM_COLOR: always
  # CI portability: `.cargo/config.toml` sets `-C target-cpu=native` for local/production
  # builds (AVX2/NEON perf). GitHub's hosted-runner fleet is CPU-heterogeneous, so
  # native codegen can emit instructions that fault on a different runner — the recurring
  # `rustc interrupted by SIGILL` on the MSRV / S3-integration jobs. Override RUSTFLAGS to a
  # fixed, universally-supported x86-64 baseline for CI (correctness, not perf); this takes
  # precedence over the config.toml target rustflags. Local + production keep `native`.
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - run: cargo test --workspace

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      - run: cargo build --release --workspace

  msrv:
    name: MSRV Check (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
      - run: cargo check --workspace

  coverage:
    name: Coverage (≥80% gate)
    runs-on: ubuntu-latest
    # The ≥80% line floor measures the SHIPPABLE library code (engine / common /
    # ffi / io / storage). `forst-rs-bench` is `publish = false` internal-only
    # perf/diagnostic tooling: dozens of wall-clock harness binaries that are not
    # — and are not meant to be — unit-tested, so each new bench bin adds hundreds
    # of 0%-covered lines and would silently erode the floor measured against the
    # real library. Excluding it via `--ignore-filename-regex` keeps the gate
    # honest: it gates the production crates (which run ~92% covered) and does NOT
    # mask any real library regression. The bench crate is still BUILT + run by
    # the `Test`/`Build Release` jobs and the dedicated bench workflows.
    # cargo-llvm-cov reports filenames relative to the package root, so the bench
    # crate's files appear as `forst-rs-bench/...` (NOT `crates/forst-rs-bench/...`).
    # The regex must match that displayed form.
    env:
      COV_IGNORE: 'forst-rs-bench/'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-llvm-cov-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-llvm-cov-
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov

      - name: Run instrumented tests once
        run: cargo llvm-cov --workspace --no-report

      - name: Generate JSON summary
        run: cargo llvm-cov report --json --output-path coverage.json --summary-only --ignore-filename-regex "$COV_IGNORE"

      - name: Write coverage summary to job summary (always, even on later gate fail)
        if: always()
        run: |
          if [[ -f coverage.json ]]; then
            PCT=$(python3 -c "import json; d=json.load(open('coverage.json')); t=d['data'][0]['totals']['lines']; print(f\"{t['percent']:.2f}\")")
          else
            PCT="(unavailable — instrumentation likely failed)"
          fi
          {
            echo "## Coverage report"
            echo ""
            echo "**Overall line coverage:** \`${PCT}%\` (gate ≥ 80%)"
            echo ""
            echo "**Stretch target (A1 §6.5):** Rust ≥ 90%"
            echo ""
            echo "Full HTML report uploaded as artifact \`coverage-html\` (1-week retention)."
            echo "lcov.info uploaded as artifact \`coverage-lcov\`."
            echo ""
            echo "Authoritative spec: \`.planning/refactor-review/A1_reconciliation.md\` §6.5"
            echo "Plan: \`.planning/refactor-review/G1_gha_rebuild_plan.md\` §3.1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov + HTML reports
        if: always()
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "$COV_IGNORE" || true
          cargo llvm-cov report --html --output-dir target/coverage-html --ignore-filename-regex "$COV_IGNORE" || true

      - name: Upload coverage HTML
        if: always() && hashFiles('target/coverage-html/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/coverage-html/
          retention-days: 7

      - name: Upload coverage lcov
        if: always() && hashFiles('lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7

      - name: Enforce coverage gate (≥80%)
        run: cargo llvm-cov report --fail-under-lines 80 --ignore-filename-regex "$COV_IGNORE"

  s3-integration:
    # B-Prod-followup-3 (§6c): validates `frs_db_open_remote` end-to-end
    # against a real S3-compatible backend (MinIO via testcontainers).
    # `ubuntu-latest` ships with Docker pre-installed, so no extra
    # `services:` block is needed — the test creates and tears down its
    # own MinIO container.
    name: S3 Integration Test (MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-s3-it-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-s3-it-
      - name: Verify Docker is available
        run: docker info
      - name: Run S3 integration test
        run: cargo test --test s3_remote_storage_it --features s3-it -p forst-rs-engine -- --nocapture

  doc:
    name: Rustdoc (strict; -D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
      - run: cargo doc --no-deps --workspace --document-private-items
