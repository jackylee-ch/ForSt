# Plan: .planning/refactor-review/G1_gha_rebuild_plan.md §1.2 @ 89104d8bd
#
# Java side CI. Currently a stub — no Java module exists yet (lands in C9
# per COMMIT_MANIFEST.md). All jobs guard on hashFiles('**/pom.xml') so
# they cleanly skip until the Java module is added.

name: ci-java

on:
  push:
    branches: [forst-rs, main]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '.github/workflows/ci-java.yml'
  pull_request:
    branches: [forst-rs, main]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '.github/workflows/ci-java.yml'
  workflow_dispatch:

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest
    if: hashFiles('**/pom.xml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25.0.3'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - run: mvn -B verify

  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    if: hashFiles('**/pom.xml') != ''
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25.0.3'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - run: mvn -B spotbugs:check

  shaded-jar:
    name: Shaded JAR
    runs-on: ubuntu-latest
    if: hashFiles('**/pom.xml') != ''
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25.0.3'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - run: mvn -B package -DskipTests
      - name: Verify shaded JAR exists
        run: |
          test -f forst-rs-flink/target/forst-rs-flink-*.jar || \
            (echo "Shaded JAR not found — verify maven-shade-plugin config"; exit 1)
      - name: Upload shaded JAR
        uses: actions/upload-artifact@v4
        with:
          name: forst-rs-flink-jar
          path: forst-rs-flink/target/forst-rs-flink-*.jar
          retention-days: 7

  no-op:
    name: No Java module yet (skip)
    runs-on: ubuntu-latest
    if: hashFiles('**/pom.xml') == ''
    steps:
      - run: |
          echo "No pom.xml in tree — Java module lands in C9 per COMMIT_MANIFEST."
          echo "This workflow becomes active once the first pom.xml is committed."
