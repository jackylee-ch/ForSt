# Plan: .planning/refactor-review/G1_gha_rebuild_plan.md §1.2 @ 89104d8bd
#
# Java side CI. Uses a preflight job to detect Java module presence at
# step level (hashFiles() is not allowed at job-level if).
# Currently a stub — no Java module exists yet (lands in C9 per
# COMMIT_MANIFEST.md). The preflight gracefully skips downstream jobs
# until pom.xml exists.

name: ci-java

on:
  push:
    branches: [forst-rs, main]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '.github/workflows/ci-java.yml'
  pull_request:
    branches: [forst-rs, main]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '.github/workflows/ci-java.yml'
  workflow_dispatch:

jobs:
  preflight:
    name: Detect Java module
    runs-on: ubuntu-latest
    outputs:
      has-java: ${{ steps.detect.outputs.has-java }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [[ -n "$(find . -name pom.xml -not -path './nexmark/*' -not -path './node_modules/*' 2>/dev/null | head -1)" ]]; then
            echo "has-java=true" >> "$GITHUB_OUTPUT"
            echo "Java module detected."
          else
            echo "has-java=false" >> "$GITHUB_OUTPUT"
            echo "No Java module yet — downstream jobs will skip. Lands in C9 per COMMIT_MANIFEST."
          fi

  build:
    name: Maven verify
    needs: preflight
    if: needs.preflight.outputs.has-java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25.0.3'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - run: mvn -B verify

  spotbugs:
    name: SpotBugs
    needs: [preflight, build]
    if: needs.preflight.outputs.has-java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25.0.3'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - run: mvn -B spotbugs:check

  shaded-jar:
    name: Shaded JAR
    needs: [preflight, build]
    if: needs.preflight.outputs.has-java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25.0.3'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - run: mvn -B package -DskipTests
      - name: Verify shaded JAR exists
        run: |
          test -f forst-rs-flink/target/forst-rs-flink-*.jar || \
            (echo "Shaded JAR not found — verify maven-shade-plugin config"; exit 1)
      - name: Upload shaded JAR
        uses: actions/upload-artifact@v4
        with:
          name: forst-rs-flink-jar
          path: forst-rs-flink/target/forst-rs-flink-*.jar
          retention-days: 7
